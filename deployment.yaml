apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web-app
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web-container
          # Matches the lab manual. After your pipeline runs once, you can replace this with
          # <your-dockerhub-username>/sample-web-app:v1.0.<run_number> to deploy your own image.
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
